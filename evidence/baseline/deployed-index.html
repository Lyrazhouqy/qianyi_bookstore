<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>纸间书店 · 动画版</title><style>
:root{--ink:#4e3d2c;--paper:#f2e8d6}*{box-sizing:border-box}body{margin:0;background:#e8dcc8;color:var(--ink);font-family:Georgia,"Songti SC","Noto Serif SC",serif}button,textarea{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #e6b45d;outline-offset:2px}header{display:flex;justify-content:space-between;align-items:center;padding:12px 4%;gap:8px}h1{font-size:clamp(22px,5vw,31px);margin:0;letter-spacing:3px}small{font-size:11px;color:#8b795e}.btn{background:#eadbc2;border:1px solid #a58a6b;border-radius:5px;padding:10px 13px;min-height:44px;color:#4e3d2c}.btn.primary{background:#708770;color:white}.game{position:relative;margin:8px auto;max-width:750px;width:96vw;height:clamp(385px,95vw,535px);background:#efe2cb;border:8px solid #b59a75;border-radius:15px;box-shadow:0 7px #9b8164;overflow:hidden;background-image:repeating-linear-gradient(124deg,transparent 0 38px,#b49c7b22 39px 40px)}.window{position:absolute;left:6%;top:8%;height:30%;width:20%;border:9px solid #8d9d82;background:#cbdbc8;border-radius:44% 44% 0 0}.window:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;background:#8d9d82}.sofa{position:absolute;bottom:14%;left:5%;width:25%;height:16%;border-radius:30% 30% 13% 13%;background:#ae7654;border:6px solid #975f3d;box-shadow:0 8px #8b5738}.sofa:before{content:"●";font-size:38px;color:#e6bc77;padding:6px}.counter{position:absolute;bottom:10%;right:4%;width:26%;height:15%;background:#b08760;border:7px solid #99704b;box-shadow:0 9px #896546}.counter:before{content:"☎";position:absolute;top:-43px;left:12px;font-size:35px;color:#728d86}.decor{position:absolute;left:5%;top:42%;font-size:46px}.plant{position:absolute;right:4%;top:7%;font-size:32px}.rug{position:absolute;bottom:3%;left:39%;width:24%;height:12%;background:#91a29c;border:7px solid #e6cdaa;transform:rotate(-3deg)}.shelves{position:absolute;left:29%;top:13%;height:59%;width:65%;display:flex;gap:3%}.shelf{flex:1;min-width:0;background:#895b36;border:7px solid #89582f;border-radius:3px;box-shadow:3px 6px #6a4b3599;display:flex;flex-direction:column;justify-content:space-between;padding:3px}.tier{display:flex;flex:1;min-height:0;gap:clamp(2px,.45vw,4px);border-bottom:9px solid #b9864b;align-items:end;padding:2px 1px 0}.spine{min-width:0;flex:1;height:78%;max-height:100%;color:#fff6df;background:#738676;border:0;border-radius:3px 2px 0 0;font-size:clamp(8px,1.35vw,12px);line-height:1.25;writing-mode:vertical-rl;white-space:normal;overflow:hidden;padding:5px 1px;box-shadow:inset 3px 0 #0002;transition:transform .18s,filter .18s}.spine:nth-child(2n){background:#b17b64;height:93%}.spine:nth-child(3n){background:#778d9c;height:72%}.spine:active{transform:translateY(-5px)}.controls{max-width:750px;margin:auto;padding:12px 3%;display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;font-size:13px}.tip{text-align:center;font-size:13px;margin:12px 8px;color:#776650}.shade{position:fixed;inset:0;background:#281f1ab8;z-index:110;display:none;align-items:center;justify-content:center;padding:12px}.shade.show{display:flex}.paper{width:min(560px,100%);max-height:90dvh;overflow:auto;background:#f4e8d2;border:8px solid #a58c67;padding:20px;position:relative;border-radius:6px;box-shadow:0 14px 40px #0007}.paper.opening{animation:paperIn .34s ease both}.paper.closing{animation:paperOut .32s ease both}.close{position:absolute;right:4px;top:4px;border:0;background:transparent;font-size:28px;padding:3px 11px}.paper h2{font-size:25px;margin:15px 26px 18px 0}.intro{background:#fff5e5;border:1px solid #d8c4a6;line-height:1.9;padding:18px;margin:12px 0}.artifact{background:#fff8e9;box-shadow:3px 5px #c9b79a;line-height:2;padding:18px;margin:12px 0;white-space:pre-wrap}.parts{perspective:800px}.part{background:#fff7e7;padding:17px;border-bottom:2px dashed #c0aa87;animation:unfold .55s cubic-bezier(.22,.75,.27,1) both;transform-origin:top}.part:nth-child(2n){background:#f6ead4}.part small{display:block;margin-bottom:10px}.unfold{display:block;width:100%;background:#dfceb0;border:0;padding:16px}.pen{display:block;margin-left:auto;font-size:34px;background:none;border:0;padding:12px;color:#897352}.stamp{width:144px;padding:21px;margin:18px auto;background:#e8cda0;border:8px dotted white;box-shadow:0 0 0 2px #ab9170;font-size:65px;text-align:center;animation:pop .68s}.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}textarea{width:100%;min-height:105px;padding:12px;border:1px solid #b69c77;background:#fffaf0;font-size:16px}.flybook{position:fixed;z-index:200;pointer-events:none;overflow:hidden;border:2px solid #e9d6ad!important;transform-origin:center;box-shadow:7px 8px 14px #0003}.flybook:after{content:"";position:absolute;inset:0 0 0 auto;width:18%;background:linear-gradient(90deg,#fff5,#fff0)}.turnpage{position:fixed;z-index:201;pointer-events:none;background:#f6e8cf;border:2px solid #a78e69;transform-origin:left center;box-shadow:6px 9px 20px #0004}.note{font-size:12px;opacity:.72}footer{font-size:11px;color:#8c7961;text-align:center;padding:15px}@keyframes unfold{from{opacity:.12;transform:rotateX(-78deg)}to{opacity:1;transform:rotateX(0deg)}}@keyframes paperIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}@keyframes paperOut{to{opacity:0;transform:scale(.85)}}@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:scale(1)}}@media(max-width:600px){.shelves{left:23%;width:73%;height:62%;top:12%}.shelf{border-width:5px;padding:2px}.tier{border-bottom-width:6px;gap:2px}.spine{font-size:clamp(8px,2.05vw,11px);padding:3px 1px}.paper{padding:16px}.counter{height:12%}.decor{font-size:30px}.window{height:25%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><header><div><small>AN ASYNCHRONOUS BOOKSHOP</small><h1>纸间书店</h1></div><button class="btn" id="restart">重新到访 ↻</button></header><div class="tip">轻触书脊 · 抽出旧书 · 翻开书页</div><div class="game"><div class="window"></div><div class="sofa"></div><div class="decor">📻</div><div class="rug"></div><div class="counter"></div><div class="plant">🪴</div><div class="shelves" id="shelves"></div></div><div class="controls"><span id="status">书店很安静</span><div><button class="btn" id="natural">自然节奏</button> <button class="btn" id="dense">密集对照</button></div></div><div class="shade" id="shade"><section class="paper" id="paper" role="dialog" aria-modal="true"><button class="close" id="close">×</button><div id="contents"></div></section></div><footer>移动端交互测试 · 本地保存 · 尚未接入多人</footer><script>
const books=[['ship','忒修斯之船','航海故事与两位读者留下的调查笔记交织成一本神秘旧书。'],['prince','小王子','一位来自遥远星球的少年通过玫瑰与狐狸理解爱和责任。'],['stranger','局外人','默尔索用近乎冷静的目光面对荒诞、生活与社会期待。'],['siddhartha','悉达多','一个人经历修行和世俗生活，寻找属于自己的智慧。'],['garden','秘密花园','一座被锁住的花园渐渐焕发生机，几位孩子的生活也随之改变。'],['night','夜航西飞','关于非洲成长、旅行与飞行冒险的回忆录。'],['kafka','海边的卡夫卡','一段穿梭在现实与梦境之间的文学旅程。'],['letters','山茶文具店','代笔店里的人们通过文字表达难以说出口的心意。'],['other','海边的房间','虚构藏书：旅人在海边停留时的短篇日记。']];
const notes={stranger:'不表现悲伤，真的就等于不悲伤吗？',garden:'我小时候想拥有秘密花园，现在更想有人和我一起照料它。',night:'有些风景只适合在夜里想起。',kafka:'不是所有道路都有地图。',letters:'没写出来的那些话，也许更重要。',other:'临走之前，我把窗户开了一会儿。'};
const letter=[['书友 A','我曾以为寻找答案，是为了有一天能够停下来。'],['书友 B','也许我们寻找的不是答案，而是值得继续追问的问题。'],['书友 C','我第二次读这本书，最喜欢的反而是那些没有回答的部分。']];
const $=id=>document.getElementById(id);let state,selected=null,mode='natural',unfold=1,writing=false,busy=false,lastSource=null;
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function save(){try{localStorage.setItem('paperbook-v3',JSON.stringify(state))}catch(e){}}
function reset(){state={visits:0,seen:[],found:[],small:0,rose:false,stamp:false,replies:[]};selected=null;unfold=1;writing=false;save();status();hide(true)}
function status(){$('status').textContent='翻书 '+state.visits+' 次 · 小发现 '+state.small+' 次 · '+(state.stamp?'🌹 邮票已获得':state.rose?'玫瑰线索进行中':'自由探索');save()}
function shelves(){const sets=[books.slice(0,3),books.slice(3,6),books.slice(6)];$('shelves').innerHTML=sets.map((a,i)=>'<div class="shelf">'+[0,1,2].map((_,r)=>'<div class="tier">'+a.map((b,j)=>'<button class="spine" data-id="'+b[0]+'" style="height:'+(64+((i*3+r*5+j*7)%31))+'%" aria-label="抽出《'+b[1]+'》">'+b[1]+'</button>').join('')+'</div>').join('')+'</div>').join('')}
function show(content){$('contents').innerHTML=content;$('shade').classList.add('show');$('paper').classList.remove('closing');$('paper').classList.remove('opening');void $('paper').offsetWidth;$('paper').classList.add('opening');$('contents').querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{let action=b.dataset.a;if(action==='rose'){state.rose=true;rose()}else if(action==='envelope'){envelope(false)}else if(action==='stamp'){state.stamp=true;envelope(true)}else if(action==='letter'){unfold=1;showLetter()}else if(action==='unfold'){unfold++;showLetter()}else if(action==='write'){writing=true;showLetter()}else if(action==='cancel'){writing=false;showLetter()}else if(action==='save'){const v=$('reply')?.value?.trim();if(v){state.replies.push(v);writing=false;unfold=letter.length+state.replies.length;showLetter()}}else if(action==='back')intro();else if(action==='note'){show('<h2>一张书友便笺</h2><div class="artifact">'+esc(notes[selected])+'</div><button class="btn" data-a="back">← 回到简介</button>')}}));status()}
function hide(force=false){if(!$('shade').classList.contains('show'))return;if(force){$('shade').classList.remove('show');return}if(busy)return;busy=true;$('paper').classList.add('closing');setTimeout(()=>{$('shade').classList.remove('show');$('paper').classList.remove('closing');if(lastSource?.isConnected){lastSource.animate([{transform:'translateY(-7px)'},{transform:'translateY(0)'}],{duration:300,easing:'ease-out'})}busy=false},310)}
function openBook(id,spine){if(busy||$('shade').classList.contains('show'))return;busy=true;selected=id;lastSource=spine;unfold=1;writing=false;const rect=spine.getBoundingClientRect(),ghost=spine.cloneNode(true);ghost.className='flybook';Object.assign(ghost.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',margin:0,writingMode:'vertical-rl',display:'flex',alignItems:'center',justifyContent:'center',background:getComputedStyle(spine).backgroundColor});document.body.appendChild(ghost);const dx=innerWidth/2-(rect.left+rect.width/2),dy=innerHeight/2-(rect.top+rect.height/2),scale=Math.min(4,160/Math.max(rect.width,1));const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function finish(){ghost.remove();state.visits++;if(!state.seen.includes(id))state.seen.push(id);intro();busy=false}if(reduced||!ghost.animate){finish();return}let anim=ghost.animate([{transform:'translate(0,0) scale(1) rotate(0deg)',opacity:1},{offset:.75,transform:'translate('+dx+'px,'+dy+'px) scale('+scale+') rotate(-6deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+scale+') rotate(0deg)',opacity:0}],{duration:550,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'});anim.onfinish=finish;anim.oncancel=finish}
function intro(){const b=books.find(x=>x[0]===selected);let extra='';if(selected==='ship'&&!state.rose&&(mode==='dense'||state.visits>=3))extra='<button class="btn primary" data-a="rose">🥀 查看夹页中的干玫瑰</button>';else if(selected==='ship'&&state.rose)extra='<div class="artifact">🥀 你发现过的干玫瑰仍在这里。</div>';else if(selected==='prince'&&state.rose&&!state.stamp)extra='<button class="btn primary" data-a="envelope">✉ 查看不显眼的信封</button>';else if(selected==='prince'&&state.stamp)extra='<div class="artifact">🌹 邮票已经收入这次发现的记忆。</div>';else if(selected==='siddhartha')extra='<button class="btn primary" data-a="letter">✉ 取出接力信</button>';else {let found=state.found.includes(selected);if(notes[selected]&&!found&&(mode==='dense'||state.visits%3===2)){state.found.push(selected);state.small++;found=true}extra=found?'<button class="btn" data-a="note">↗ 展开书友便笺</button>':'<p class="note">这次没有遇见新的阅读痕迹。</p>'}show('<h2>《'+esc(b[1])+'》</h2><div class="intro">'+esc(b[2])+'</div><div class="row">'+extra+'</div>')}
function rose(){show('<h2>干枯的玫瑰</h2><div class="artifact" style="text-align:center;font-size:66px">🥀</div><div class="artifact">一张纸条：另一朵玫瑰守着一个小惊喜。也许你知道去哪里找。</div><button class="btn" data-a="back">← 返回简介</button>')}
function envelope(done){show(done||state.stamp?'<h2>玫瑰邮票</h2><div class="stamp">🌹</div><p>这段跨书寻宝到这里结束了。</p><button class="btn" data-a="back">返回简介</button>':'<h2>一只旧信封</h2><div class="artifact">书页间有一只不显眼的信封，封口上压着玫瑰印记。</div><button class="btn primary" data-a="stamp">拆开信封 →</button>')}
function showLetter(){const all=letter.concat(state.replies.map((r,i)=>['你的续写 '+(i+1),r]));let out='<h2>一封被续写的信</h2><p class="note">沿折痕逐段展开，末尾点击笔才续写。</p><div class="parts">';all.slice(0,unfold).forEach(([name,txt])=>out+='<div class="part"><small>'+esc(name)+'</small>'+esc(txt)+'</div>');out+='</div>';if(unfold<all.length)out+='<button class="unfold" data-a="unfold">⌄ 沿折痕继续展开</button>';else if(writing)out+='<textarea id="reply" placeholder="写在信的末尾……"></textarea><div class="row"><button class="btn" data-a="cancel">放下笔</button><button class="btn primary" data-a="save">写在信上</button></div>';else out+='<div class="artifact"><button class="pen" data-a="write" aria-label="拿起笔续写">✎</button><div style="clear:both"></div></div>';show(out+'<div class="row"><button class="btn" data-a="back">← 返回简介</button></div>')}
shelves();$('shelves').addEventListener('click',e=>{let x=e.target.closest('.spine');if(x)openBook(x.dataset.id,x)});$('close').onclick=()=>hide();$('shade').onclick=e=>{if(e.target===$('shade'))hide()};$('restart').onclick=reset;$('natural').onclick=()=>{mode='natural';reset()};$('dense').onclick=()=>{mode='dense';reset()};reset();
</script></body></html>
