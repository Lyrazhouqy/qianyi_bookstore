    <p id="save-warning" role="status" hidden></p>

    </dialog>
    <dialog class="shop-sheet window-sheet" id="window-settings" aria-labelledby="window-settings-title">
      <div class="sheet-heading window-heading"><div><small>窗 外 一 景</small><h2 id="window-settings-title">今天，望向哪里？</h2></div><button class="sheet-close" data-close-sheet aria-label="收起窗外风景">×</button></div>

        <button class="window-choice" data-window-scene="original" aria-label="树影" aria-pressed="true"><span class="window-thumbnail window-original" aria-hidden="true"></span><strong>树影</strong><small><span class="window-current">正在看 · </span>叶影轻摇</small></button>

        <button class="window-choice" data-window-scene="sunset" aria-label="晚霞" aria-pressed="false"><img class="window-thumbnail" src="assets/scene/window-sunset-v0611.png" alt="" loading="lazy" draggable="false"><strong>晚霞</strong><small><span class="window-current">正在看 · </span>落日余温</small></button>
        <button class="window-choice" data-window-scene="snow" aria-label="初雪" aria-pressed="false"><img class="window-thumbnail" src="assets/scene/window-snow-v0611.png" alt="" loading="lazy" draggable="false"><strong>初雪</strong><small><span class="window-current">正在看 · </span>静静落雪</small></button>
        <button class="window-choice" data-window-scene="custom" aria-label="上传自己的照片" aria-pressed="false" id="window-custom-choice"><span class="window-thumbnail window-upload-art"><img id="window-custom-preview" alt="" hidden><svg class="photo-placeholder" viewBox="0 0 100 100" aria-hidden="true"><rect x="13" y="15" width="66" height="70" rx="3" fill="#faf3df" stroke="#b8ae91" stroke-width="2" transform="rotate(-5 46 50)"/><path d="M22 65L38 45L50 59L60 50L73 67Z" fill="#aebc94"/><circle cx="61" cy="32" r="7" fill="#e7c87d"/><circle cx="76" cy="75" r="18" fill="#77948a"/><path d="M76 66V84M67 75H85" stroke="#faf6e8" stroke-width="3" stroke-linecap="round"/></svg><span class="photo-add-badge" aria-hidden="true" hidden>＋</span></span><strong>自己的照片</strong><small><span class="window-current">正在看 · </span><span id="window-photo-hint">点此上传</span></small></button>
      </div>
      <div class="window-bottom">
        <div><p class="window-message" id="window-message" role="status"></p><p class="window-upload-note">本机图片 · 最大4MB</p></div>
        <input type="file" id="window-file" accept="image/png,image/jpeg,image/webp,image/avif" aria-label="选择自己的照片" hidden>
      </div>
    </dialog>
    <dialog class="shop-sheet" id="book-index" aria-labelledby="book-index-title">
      <div class="sheet-heading"><div><small>纸 间 藏 书</small><h2 id="book-index-title">今天，翻哪一本？</h2></div><button class="sheet-close" data-close-sheet aria-label="收起选书单">×</button></div>
      <div class="book-catalogue" id="book-catalogue"></div>
      <p class="sheet-note">选中的书，会从它原来的书位来到你面前。</p>
    </dialog>
    <dialog class="shop-sheet journal-sheet" id="shop-journal" aria-labelledby="shop-journal-title">
      <div class="sheet-heading"><div><small>来 过 的 痕 迹</small><h2 id="shop-journal-title">书店手记</h2></div><button class="sheet-close" data-close-sheet aria-label="收起书店手记">×</button></div>
      <p class="journal-copy" id="journal-summary">书店很安静。</p><p class="journal-visit" data-visit-label>书店很安静</p>
      <div class="journal-setting"><span>阅读节奏</span><div><button class="btn" id="natural" aria-pressed="true">自然节奏</button> <button class="btn" id="dense" aria-pressed="false">密集对照</button></div></div>
      <button class="quiet-button" id="restart">重新到访 ↻</button>
      <p class="sheet-note">自然节奏里，痕迹慢慢出现。密集对照会更早露出线索。<br>文字保存在本机，尚未接入多人或跨设备同步。</p>
    </dialog>
  </main>
  <div class="shade" id="shade" hidden>
    <section class="paper" id="paper" role="dialog" aria-modal="true" aria-labelledby="book-title" tabindex="-1">
