        <button class="window-choice" data-window-scene="original" aria-label="树影" aria-pressed="true"><img class="window-thumbnail" src="assets/scene/window-original-flat-v01415.png" alt="" loading="lazy" draggable="false"><strong>树影</strong><small><span class="window-current">正在看 · </span>叶影轻摇</small></button>
        <button class="window-choice" data-window-scene="rain" aria-label="雨后山色" aria-pressed="false"><img class="window-thumbnail" src="assets/scene/window-rain-flat-v01415.png" alt="" loading="lazy" draggable="false"><strong>雨后山色</strong><small><span class="window-current">正在看 · </span>雨歇山青</small></button>
        <button class="window-choice" data-window-scene="nightSnow" aria-label="雪夜" aria-pressed="false"><img class="window-thumbnail" src="assets/scene/window-night-snow-flat-v01415.png" alt="" loading="lazy" draggable="false"><strong>雪夜</strong><small><span class="window-current">正在看 · </span>静静飘雪</small></button>
        <button class="window-choice" data-window-scene="custom" aria-label="上传自己的照片" aria-pressed="false" id="window-custom-choice"><span class="window-thumbnail window-upload-art"><img id="window-custom-preview" alt="" hidden><svg class="photo-placeholder" viewBox="0 0 100 100" aria-hidden="true"><rect x="13" y="15" width="66" height="70" rx="3" fill="#faf3df" stroke="#b8ae91" stroke-width="2" transform="rotate(-5 46 50)"/><path d="M22 65L38 45L50 59L60 50L73 67Z" fill="#aebc94"/><circle cx="61" cy="32" r="7" fill="#e7c87d"/><circle cx="76" cy="75" r="18" fill="#77948a"/><path d="M76 66V84M67 75H85" stroke="#faf6e8" stroke-width="3" stroke-linecap="round"/></svg><span class="photo-add-badge" aria-hidden="true" hidden>＋</span></span><strong>自己的照片</strong><small><span class="window-current">正在看 · </span><span id="window-photo-hint">点此上传</span></small></button>
      </div>
      <div class="window-bottom">
        <div><p class="window-message" id="window-message" role="status"></p><p class="window-upload-note">本机图片 · 最大4MB</p></div>
        <div class="window-photo-actions"><button type="button" class="quiet-button" id="window-clear-photo" aria-label="移除自己的照片" hidden>移除照片</button><button type="button" class="quiet-button" id="window-undo-photo" hidden>撤销移除</button></div>
        <input type="file" id="window-file" accept="image/png,image/jpeg,image/webp,image/avif" aria-label="选择自己的照片" hidden>
      </div>
    </dialog>
    <dialog class="shop-sheet" id="book-index" aria-labelledby="book-index-title">
      <div class="sheet-heading"><div><small>纸 间 藏 书</small><h2 id="book-index-title">今天，翻哪一本？</h2></div><button class="sheet-close" data-close-sheet aria-label="收起选书单">×</button></div>
      <div class="book-catalogue" id="book-catalogue"></div>
      <p class="sheet-note">选中的书，会从它原来的书位来到你面前。</p>
    </dialog>
    <dialog class="shop-sheet journal-sheet" id="shop-journal" aria-labelledby="shop-journal-title">
      <div class="sheet-heading"><div><small>店 主 的 营 业 日 记</small><h2 id="shop-journal-title">书店手记</h2></div><button class="sheet-close" data-close-sheet aria-label="收起书店手记">×</button></div>
      <p class="journal-intro">随手记一点，留给坐下来的人。</p>
      <div class="journal-leaf" tabindex="0" role="region" aria-label="店主手记正文，轻点看完这页"></div>
      <div class="journal-signature"><span>—— 店主</span><button type="button" data-journal-reveal>轻点，看完这页</button></div>
      <nav class="journal-navigation" aria-label="翻阅店主手记"><button type="button" data-journal-older aria-label="往前翻一页手记">← 往前翻</button><span class="journal-page-count" role="status"></span><button type="button" data-journal-newer aria-label="回到较近的一页手记">近一页 →</button></nav>
      <details class="journal-backmatter"><summary>来过的痕迹</summary>
      <p class="journal-copy" id="journal-summary">书店很安静。</p><p class="journal-visit" data-visit-label>书店很安静</p>
      <div class="journal-setting"><span>阅读节奏</span><div><button class="btn" id="natural" aria-pressed="true">自然节奏</button> <button class="btn" id="dense" aria-pressed="false">密集对照</button></div></div>
      <button class="quiet-button" id="restart">重新到访 ↻</button>
      <p class="sheet-note">自然节奏里，痕迹慢慢出现。密集对照会更早露出线索。<br>文字保存在本机，尚未接入多人或跨设备同步。</p>
      </details>
    </dialog>
  </main>
  <div class="shade" id="shade" hidden>
    <section class="paper" id="paper" role="dialog" aria-modal="true" aria-labelledby="book-title" tabindex="-1">
      <div class="paper-toolbar"><span aria-hidden="true">纸 间 藏 书</span><button class="close" id="close" aria-label="合书并放回书架">×</button></div>
      <div class="paper-scroll" id="paper-scroll"><div id="contents"></div></div>
      <div class="book-cover" id="book-cover" aria-hidden="true">
        <div class="cover-binding"></div><span class="cover-label">纸 间 藏 书</span>
        <span class="cover-title" id="cover-title"></span><span class="cover-mark">❧</span>
      </div>
    </section>
  </div>
</body>
</html>
